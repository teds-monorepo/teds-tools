<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UI Editor — topdown-game</title>
<style>
  :root {
    --bg: #0b0e1a; --panel: #131729; --panel2: #171c33; --line: #252b45;
    --text: #e8eaf3; --muted: #8891ab; --accent: #6c8bff; --accent2: #3ecf8e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

  header {
    flex: 0 0 56px; display: flex; align-items: center; gap: 12px;
    padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header .logo { font-size: 15px; font-weight: 600; white-space: nowrap; }
  header .spacer { flex: 1 1 auto; }
  header .hint-top { font-size: 11px; color: var(--muted); }
  header button {
    font: inherit; color: var(--muted); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 9px; padding: 6px 12px; cursor: pointer;
  }
  header button:hover { color: var(--text); }
  header button.primary { color: #fff; background: #3b6ea5; border-color: #4a80bb; }
  header button.primary:hover { background: #4a80bb; }
  header select {
    font: inherit; color: var(--text); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 9px; padding: 5px 8px;
  }

  main { flex: 1 1 auto; min-height: 0; display: flex; }

  #sidebar {
    width: 230px; flex: 0 0 auto; background: var(--panel2);
    border-right: 1px solid var(--line); padding: 16px 10px; overflow-y: auto;
  }
  .side-title { font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); padding: 0 8px 8px; }
  .subitem {
    width: 100%; text-align: left; display: flex; align-items: center; gap: 9px;
    padding: 8px 10px; border-radius: 9px; border: 1px solid transparent;
    background: none; color: var(--muted); font: inherit; cursor: pointer;
  }
  .subitem:hover { color: var(--text); background: var(--panel); }
  .subitem.on { background: rgba(108,139,255,.14); border-color: rgba(108,139,255,.3); color: var(--text); }
  .subitem .ico {
    width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 12px;
    background: rgba(108,139,255,.12); border: 1px solid var(--line);
  }

  #viewport {
    position: relative; flex: 1 1 auto; min-width: 0; min-height: 0;
    overflow: auto; padding: 16px;
  }
  /* margin:auto, not flex centring: a flex-centred child larger than its
     scroll container is clipped at the start, which hides the panel's corner. */
  #stage-canvas {
    display: block; margin: auto;
    box-shadow: 0 8px 30px rgba(0,0,0,.45);
    cursor: crosshair;
  }

  #inspector {
    width: 340px; flex: 0 0 auto; display: flex; flex-direction: column;
    background: var(--panel2); border-left: 1px solid var(--line); min-height: 0;
  }
  .insp-head { padding: 14px; border-bottom: 1px solid var(--line); font-weight: 600; }
  #insp-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px 14px 48px; }
  .caption {
    font-size: 10px; text-transform: uppercase; letter-spacing: .7px;
    color: var(--accent); margin: 14px 0 6px;
  }
  .caption:first-child { margin-top: 0; }
  .note { color: var(--muted); font-size: 11px; margin: 0 0 6px; }

  .node-tree { display: flex; flex-direction: column; gap: 1px; padding: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  .node-row {
    font: inherit; font-size: 11.5px; text-align: left; cursor: pointer; color: var(--muted);
    background: none; border: 1px solid transparent; border-radius: 6px; padding: 3px 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .node-row:hover { color: var(--text); background: var(--panel); }
  .node-row.on { color: var(--text); background: rgba(108,139,255,.16); border-color: rgba(108,139,255,.34); }

  .group { border-left: 1px solid var(--line); padding-left: 8px; margin: 8px 0; }
  .group > .g-title { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 4px; }
  .row { display: grid; grid-template-columns: 1fr 74px 74px 18px; align-items: center; gap: 5px; margin: 2px 0; }
  .row.two { grid-template-columns: 1fr 74px 18px; }
  .row.four { grid-template-columns: 1fr 62px 62px 18px; }
  .row label { font-size: 11.5px; color: var(--text); opacity: .85; }
  .row input[type="number"], .row input[type="text"], .row select {
    font: inherit; font-size: 11.5px; width: 100%; padding: 2px 5px;
    color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 5px;
  }
  .row input[type="color"] { width: 100%; height: 22px; padding: 1px; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; }
  .row input[type="checkbox"] { justify-self: center; }
  .row .clear {
    font: inherit; font-size: 11px; line-height: 1; padding: 3px 0; cursor: pointer;
    color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 5px;
  }
  .status { font-size: 11px; min-height: 15px; color: var(--muted); margin-top: 8px; }
  .status[data-kind="ok"] { color: #79c08a; }
  .status[data-kind="error"] { color: #e07a6a; }
  @media (max-width: 900px) {
    #sidebar { display: none; }
    #inspector { width: 290px; }
  }
</style>
  <script type="module" crossorigin src="./assets/editor-Bxo1s1di.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/ui-config-BagEic82.js">
</head>
<body>
<header>
  <span class="logo">🎛 UI Editor</span>
  <span class="hint-top" id="hint-top">src/config/ui-config.json</span>
  <span class="spacer"></span>
  <select id="device" title="Khung thiết kế">
    <option value="desktop">Desktop 1280×720</option>
    <option value="mobile">Mobile 414×896</option>
  </select>
  <select id="zoom" title="Mức phóng">
    <option value="fit">Vừa khung</option>
    <option value="1">100%</option>
    <option value="2">200%</option>
  </select>
  <button id="revert">Hoàn tác</button>
  <button id="save" class="primary">Lưu</button>
</header>

<main>
  <aside id="sidebar">
    <div class="side-title">Roots</div>
    <div id="root-list"></div>
  </aside>
  <section id="viewport"><canvas id="stage-canvas"></canvas></section>
  <aside id="inspector">
    <div class="insp-head" id="insp-title">Chọn một root</div>
    <div id="insp-scroll">
      <div class="caption">Nodes</div>
      <div class="node-tree" id="node-tree"></div>
      <div id="fields"></div>
      <div class="status" id="status"></div>
    </div>
  </aside>
</main>

</body>
</html>
